<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gestão Veicular</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/dashboard.css" />
  <link rel="stylesheet" href="/css/forms.css" />
  <link rel="stylesheet" href="/css/tables.css" />
  <link rel="stylesheet" href="/css/responsive.css" />
</head>
<body class="app-body">
  <header class="app-header" id="app-header">
    <div class="header-left">
      <button class="menu-toggle" id="menu-toggle" aria-label="Menu">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <div class="app-brand">
        <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 16H9m10 0h3v-3.15a1 1 0 0 0-.84-.99L16 11l-2.7-3.6a1 1 0 0 0-.8-.4H5.24a2 2 0 0 0-1.8 1.1l-.8 1.63A6 6 0 0 0 2 12.42V16h2"/><circle cx="6.5" cy="16.5" r="2.5"/><circle cx="16.5" cy="16.5" r="2.5"/></svg>
        <span>Gestão Veicular</span>
      </div>
    </div>
    <div class="header-right">
      <div class="vehicle-selector">
        <label for="vehicle-select" class="visually-hidden">Veículo ativo</label>
        <select id="vehicle-select" aria-label="Selecionar veículo">
          <option value="">Selecione um veículo</option>
        </select>
      </div>
      <div class="user-area" id="user-area">
        <img id="user-photo" alt="" referrerpolicy="no-referrer" />
        <span id="user-name"></span>
        <button id="btn-logout" class="btn-logout" title="Sair">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        </button>
      </div>
    </div>
  </header>

  <div class="app-layout">
    <nav class="sidebar" id="sidebar">
      <ul class="nav-list">
        <li><a href="#dashboard" class="nav-link active" data-view="dashboard">Dashboard</a></li>
        <li><a href="#vehicles" class="nav-link" data-view="vehicles">Veículos</a></li>
        <li><a href="#refuels" class="nav-link" data-view="refuels">Abastecimentos</a></li>
        <li><a href="#maintenances" class="nav-link" data-view="maintenances">Manutenções</a></li>
        <li><a href="#expenses" class="nav-link" data-view="expenses">Despesas</a></li>
        <li><a href="#trips" class="nav-link" data-view="trips">Viagens</a></li>
        <li><a href="#finance" class="nav-link" data-view="finance">Financeiro</a></li>
        <li><a href="#reports" class="nav-link" data-view="reports">Relatórios</a></li>
        <li><a href="#sharing" class="nav-link" data-view="sharing">Compartilhamentos</a></li>
        <li><a href="#settings" class="nav-link" data-view="settings">Configurações</a></li>
      </ul>
    </nav>

    <main class="app-main" id="app-main">
      <!-- Conteúdo dinâmico por view -->
      <section id="view-dashboard" class="view active"></section>
      <section id="view-vehicles" class="view"></section>
      <section id="view-refuels" class="view"></section>
      <section id="view-maintenances" class="view"></section>
      <section id="view-expenses" class="view"></section>
      <section id="view-trips" class="view"></section>
      <section id="view-finance" class="view"></section>
      <section id="view-reports" class="view"></section>
      <section id="view-sharing" class="view"></section>
      <section id="view-settings" class="view"></section>
    </main>
  </div>

  <div class="fab-container" id="fab-container">
    <button class="fab-main" id="fab-main" aria-label="Adicionar registro" type="button">
      <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    </button>
    <div class="fab-menu" id="fab-menu" hidden>
      <button class="fab-item" data-add="refuel">+ Abastecimento</button>
      <button class="fab-item" data-add="maintenance">+ Manutenção</button>
      <button class="fab-item" data-add="expense">+ Despesa</button>
      <button class="fab-item" data-add="trip">+ Viagem</button>
    </div>
  </div>

  <div class="modal-overlay" id="modal-overlay" hidden>
    <div class="modal" id="modal" role="dialog" aria-modal="true"></div>
  </div>

  <div class="toast-container" id="toast-container"></div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
